# ─────────────────────────────────────────────────────────────
#  NourishAI — Continuous Integration
#
#  Runs on every push and pull request to main/develop.
#  Two jobs run in parallel:
#    1. backend  — spins up real Postgres, runs Django tests
#    2. frontend — lints and builds the React app
# ─────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ── Job 1: Django Backend ──────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    # GitHub Actions can spin up Docker containers alongside your job.
    # This gives us a real PostgreSQL server — same engine as production.
    # Django will create 'test_nourishai' inside it, run tests, then drop it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nourishai_db
          POSTGRES_USER: nourishai_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        # Don't start the job until Postgres is actually ready to accept connections
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'NourishAI/requirements.txt'

      - name: Install dependencies
        working-directory: NourishAI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: NourishAI
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          DB_NAME: nourishai_db
          DB_USER: nourishai_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          GROQ_API_KEY: dummy
          PAYSTACK_SECRET_KEY: dummy
          EMAIL_HOST_USER: dummy@example.com
          EMAIL_HOST_PASSWORD: dummy
        run: python manage.py check --settings=nourishai.settings_test

      - name: Run migrations
        working-directory: NourishAI
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          DB_NAME: nourishai_db
          DB_USER: nourishai_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          GROQ_API_KEY: dummy
          PAYSTACK_SECRET_KEY: dummy
          EMAIL_HOST_USER: dummy@example.com
          EMAIL_HOST_PASSWORD: dummy
        run: python manage.py migrate --settings=nourishai.settings_test

      - name: Run tests
        working-directory: NourishAI
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          DB_NAME: nourishai_db
          DB_USER: nourishai_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          GROQ_API_KEY: dummy
          PAYSTACK_SECRET_KEY: dummy
          EMAIL_HOST_USER: dummy@example.com
          EMAIL_HOST_PASSWORD: dummy
        run: python manage.py test --settings=nourishai.settings_test --verbosity=2

  # ── Job 2: React Frontend ──────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'NourishAI/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: NourishAI/frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: NourishAI/frontend
        run: npm run lint

      - name: Build (Vite)
        working-directory: NourishAI/frontend
        run: npm run build
        env:
          NODE_ENV: production