name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nourishai_db
          POSTGRES_USER: nourishai_user
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          DB_NAME: nourishai_db
          DB_USER: nourishai_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          GROQ_API_KEY: dummy
          PAYSTACK_SECRET_KEY: dummy
          EMAIL_HOST_USER: dummy@example.com
          EMAIL_HOST_PASSWORD: dummy
        run: python manage.py check --settings=nourishai.settings_test

      - name: Run migrations
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          DB_NAME: nourishai_db
          DB_USER: nourishai_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          GROQ_API_KEY: dummy
          PAYSTACK_SECRET_KEY: dummy
          EMAIL_HOST_USER: dummy@example.com
          EMAIL_HOST_PASSWORD: dummy
        run: python manage.py migrate --settings=nourishai.settings_test

      - name: Run tests
        env:
          SECRET_KEY: ci-secret-key-not-used-in-production
          DEBUG: 'True'
          DB_NAME: nourishai_db
          DB_USER: nourishai_user
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: '5432'
          GROQ_API_KEY: dummy
          PAYSTACK_SECRET_KEY: dummy
          EMAIL_HOST_USER: dummy@example.com
          EMAIL_HOST_PASSWORD: dummy
        run: python manage.py test --settings=nourishai.settings_test --verbosity=2

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Build (Vite)
        working-directory: frontend
        run: npm run build
        env:
          NODE_ENV: production