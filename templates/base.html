<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NourishAI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #F8FAF9; }
        .navbar { background-color: #1B4332 !important; }
        .btn-primary { background-color: #2D6A4F; border-color: #2D6A4F; }
        .btn-primary:hover { background-color: #1B4332; border-color: #1B4332; }
        .text-primary { color: #2D6A4F !important; }
        .bg-brand { background-color: #2D6A4F; }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'meals:dashboard' %}">
                🥗 NourishAI
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto">
                    <a class="nav-link text-white" href="{% url 'meals:dashboard' %}">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                    <a class="nav-link text-white" href="{% url 'meals:generate_plan' %}">
                        <i class="fas fa-utensils"></i> Generate Plan
                    </a>
                    <a class="nav-link text-white" href="{% url 'meals:meal_plan_history' %}">
    <i class="fas fa-history"></i> History
</a>
                    <a class="nav-link text-white" href="{% url 'users:profile' %}">
                        <i class="fas fa-user"></i> {{ user.first_name }}
                    </a>
                    <a class="nav-link text-white" href="{% url 'users:logout' %}">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
