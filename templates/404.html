<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — NourishAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0A0F0D;
            color: #F0F4F1;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(46,204,113,0.06), transparent 60%);
            pointer-events: none;
        }
        .container { max-width: 480px; position: relative; z-index: 1; }
        .code {
            font-family: 'Cormorant Garamond', serif;
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #2ECC71, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .emoji { font-size: 3rem; margin: 1rem 0; }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }
        p {
            color: rgba(240,244,241,0.5);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #2ECC71, #1a7a43);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.75rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(46,204,113,0.25);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46,204,113,0.35);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="emoji">🍽️</div>
        <h1>This page doesn't exist</h1>
        <p>Looks like this meal was taken off the menu. Let's get you back to something good.</p>
        <a href="/meals/dashboard/" class="btn">
            ← Back to Dashboard
        </a>
    </div>
</body>
</html>
