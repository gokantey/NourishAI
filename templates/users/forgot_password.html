{% extends 'base.html' %}
{% block title %}Forgot Password — NourishAI{% endblock %}
{% block unauth_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--obsidian)">
    <div style="width:100%;max-width:440px" class="fade-up">

        <div style="text-align:center;margin-bottom:2.5rem">
            <div style="font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:white;margin-bottom:0.5rem">
                Nourish<span style="color:var(--gold)">AI</span>
            </div>
            <div style="font-size:3rem;margin:1rem 0">🔑</div>
            <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;margin-bottom:0.5rem">
                Forgot your password?
            </h3>
            <p style="color:var(--text-muted);font-size:0.9rem;line-height:1.6">
                Enter the email address linked to your account and we'll send you a reset link.
            </p>
        </div>

        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">Email Address</label>
                        <input type="email" name="email" required
                               class="form-control form-control-lg"
                               placeholder="e.g. kofi@gmail.com"
                               autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3" style="font-size:1rem">
                        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                    </button>
                </form>
            </div>
        </div>

        <p style="text-align:center;color:var(--text-muted);font-size:0.88rem;margin-top:1.5rem">
            Remembered it?
            <a href="{% url 'users:login' %}" style="color:var(--emerald);font-weight:600;text-decoration:none">
                Back to Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
