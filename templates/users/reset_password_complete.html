{% extends 'base.html' %}
{% block title %}Password Reset Successful — NourishAI{% endblock %}
{% block unauth_content %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;background:var(--obsidian)">
    <div style="width:100%;max-width:440px;text-align:center" class="fade-up">

        <div style="font-family:'Cormorant Garamond',serif;font-size:2.5rem;font-weight:700;color:white;margin-bottom:2rem">
            Nourish<span style="color:var(--gold)">AI</span>
        </div>

        <div class="card">
            <div class="card-body p-5">
                <div style="font-size:4rem;margin-bottom:1.5rem">✅</div>
                <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;margin-bottom:1rem">
                    Password reset!
                </h3>
                <p style="color:var(--text-muted);font-size:0.92rem;line-height:1.7;margin-bottom:2rem">
                    Your password has been successfully updated. You can now log in with your new password.
                </p>
                <a href="{% url 'users:login' %}" class="btn btn-primary w-100 py-3" style="font-size:1rem">
                    <i class="fas fa-sign-in-alt me-2"></i>Login Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
