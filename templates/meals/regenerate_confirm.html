{% extends 'base.html' %}
{% block title %}Swap Meal — NourishAI{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5 text-center">
                <div style="font-size:3rem">↺</div>
                <h4 class="fw-bold mt-3" style="color:#1B4332">Swap this meal?</h4>
                <p class="text-muted">
                    <strong>{{ meal.title }}</strong><br>
                    {{ meal.day|title }} — {{ meal.meal_type|title }}
                </p>
                <p class="text-muted small">The AI will generate a completely different meal for this slot.</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning px-4">Yes, swap it</button>
                    <a href="{% url 'meals:meal_plan_detail' meal.meal_plan.pk %}"
                       class="btn btn-outline-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
