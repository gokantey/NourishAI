{% extends 'base.html' %}
{% block title %}Save Meal Plan — NourishAI{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div style="font-size:3rem">🔖</div>
                    <h4 class="fw-bold mt-2" style="color:#1B4332">Save This Plan</h4>
                    <p class="text-muted">Give your meal plan a name so you can find it easily later</p>
                </div>

                <form method="post" action="{% url 'meals:confirm_save_plan' meal_plan.pk %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Plan Name</label>
                        <input type="text" name="title" class="form-control form-control-lg"
                               placeholder="e.g. My Keto Week, Bulking Plan, January Plan..."
                               maxlength="100" autofocus>
                        <small class="text-muted">Leave blank to use the default name</small>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary px-4">
                             Save Plan
                        </button>
                        <a href="{% url 'meals:meal_plan_detail' meal_plan.pk %}"
                           class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
