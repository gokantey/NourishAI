{% extends 'base.html' %}
{% block title %}Save Plan — NourishAI{% endblock %}
{% block content %}
<div style="min-height:80vh;display:flex;align-items:center;justify-content:center">
    <div style="width:100%;max-width:440px" class="fade-up">
        <div class="card">
            <div class="card-body p-5 text-center">
                <div style="font-size:3.5rem;margin-bottom:1rem">🔖</div>
                <h3 style="font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:600;margin-bottom:0.5rem">
                    Save This Plan
                </h3>
                <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:2rem">
                    Give it a name so you can find it easily later
                </p>
                <form method="post" action="{% url 'meals:confirm_save_plan' meal_plan.pk %}">
                    {% csrf_token %}
                    <div class="mb-4 text-start">
                        <label class="form-label">Plan Name</label>
                        <input type="text" name="title" class="form-control form-control-lg"
                               placeholder="e.g. My Keto Week, Bulking Plan..."
                               maxlength="100" autofocus>
                        <div style="font-size:0.78rem;color:var(--text-muted);margin-top:0.4rem">
                            Leave blank to use default name
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-fill py-2">
                            <i class="fas fa-save me-2"></i>Save Plan
                        </button>
                        <a href="{% url 'meals:meal_plan_detail' meal_plan.pk %}"
                           class="btn btn-ghost flex-fill py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
